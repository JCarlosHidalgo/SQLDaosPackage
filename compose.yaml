services:

  # APACHE-TO-DISPLAY-TEST-RESULTS-AND-DOCS
  apache:
    container_name: SQLDaosPackageApache
    image: httpd:2.4.65-alpine
    ports:
      - "5000:80"
    volumes:
      - sql-daos-package-test-results:/usr/local/apache2/htdocs/test/
      - package-docs-html:/usr/local/apache2/htdocs/docs/
      - ./index.html:/usr/local/apache2/htdocs/index.html:ro
    depends_on:
      package-test:
        condition: service_completed_successfully
      doc-build:
        condition: service_completed_successfully

  # TESTING-PACKAGE
  package-test:
    container_name: SQLDaosPackageTest
    build:
      dockerfile: Dockerfile
    volumes:
      - sql-daos-package-test-results:/test-env/SQLDaosPackage.Test/TestResults/
    environment:
      - MYSQL_CONNECTION_STRING=server=SQLDaosPackageMySQLHost;port=3306;uid=root;pwd=admin;database=SchemaTest;Allow User Variables=True
    command : bash -c "
        dotnet test -s ./.runsettings
        && dotnet reportgenerator -reports:"**/*.cobertura.xml" -targetdir:./TestResults
      "
    depends_on:
      database-for-testing:
        condition: service_healthy

  # MYSQL-HOST-FOR-TESTING
  database-for-testing:
    container_name: SQLDaosPackageMySQLHost
    image: mysql:9
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=admin
      - MYSQL_DATABASE=SchemaTest
    volumes:
      - ./SQLDaosPackage.Test/db-environment/init-db:/docker-entrypoint-initdb.d
      - ./SQLDaosPackage.Test/db-environment/data:/var/lib/mysql-files/
    healthcheck:
      test: ["CMD-SHELL", "mysql -u root -padmin -e 'select * from SchemaTest.User'"]
      interval: 2s
      retries: 60

  # BUILD-PACKAGE-DOCS
  doc-build:
    container_name: DocsBuilder
    build:
      dockerfile: ./SQLDaosPackage.Code/Dockerfile.docs
    volumes:
      - package-docs-html:/work/Documentation/

volumes:
  sql-daos-package-test-results:
  package-docs-html:
